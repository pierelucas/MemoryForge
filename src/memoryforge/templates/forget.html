{% extends "base.html" %}
{% block title %}{{ t('forget.title') }}{% endblock %}
{% block main %}
<header class="mast">
  <div class="mast-row"><h1>{{ t('forget.heading') }}</h1></div>
  <p class="lede">{{ t('forget.lede') }}</p>
</header>
<article class="card">
  <p class="body">{{ memory.text }}</p>
  <div class="meta">
    <span class="pill">{{ memory.kind_label }}</span>
    <span class="pill">{{ memory.scope_label }}</span>
  </div>
</article>
<form method="post" action="/memories/{{ memory.id }}/forget" class="composer-row confirm-row">
  <button type="submit" class="danger">{{ t('forget.action') }}</button>
  <a class="ghost-link" href="/?scope={{ memory.scope | urlencode }}">{{ t('forget.cancel') }}</a>
</form>
{% endblock %}
