[project]
name = "memoryforge"
version = "0.1.0"
description = "Lokales Gedächtnis für Coding-Agenten. MCP, Notiz-Oberfläche, ZIP-Umzug."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Julian Huch" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "typer>=0.12",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "tomli>=2.0.1; python_version < '3.11'",
  "tomli-w>=1.0",
  "mcp>=2.3,<3",
  "fastembed>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
memoryforge = "memoryforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memoryforge"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
